name: Run real experiment

on:
  workflow_dispatch:
    inputs:
      commit_evidence:
        description: Commit the generated evidence pack back to the selected branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Download dataset
        run: python scripts/download_data.py

      - name: Generate EDA outputs
        run: python scripts/run_eda.py

      - name: Run baseline benchmark
        run: python scripts/train_baseline.py

      - name: Run cross-validation benchmark
        run: python scripts/benchmark_cv.py

      - name: Run Phase 3 analysis
        run: python scripts/run_phase3_analysis.py

      - name: Finalise project results
        run: python scripts/finalise_project.py

      - name: Build assessor evidence pack
        run: python scripts/build_evidence_pack.py

      - name: Upload complete experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: am2-01-real-experiment-results
          path: |
            results/
            evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Commit compact evidence pack
        if: ${{ inputs.commit_evidence }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Add real predictive-maintenance experiment evidence"
          git push origin HEAD:${{ github.ref_name }}
